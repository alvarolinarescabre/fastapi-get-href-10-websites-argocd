apiVersion: v1
kind: Service
metadata:
  name: fastapi-app-get-href-from-10-websites
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app.kubernetes.io/name: fastapi-app-get-href-from-10-websites
  type: LoadBalancer
  externalTrafficPolicy: Cluster

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: minikube-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.49.200-192.168.49.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: minikube-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - minikube-pool
